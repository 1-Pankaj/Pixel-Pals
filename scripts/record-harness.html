<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Pals Recording Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 640px;
    height: 400px;
    overflow: hidden;
    background: #1e1b2e;
    font-family: 'Nunito', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .window {
    width: 620px;
    height: 380px;
    background: #fff;
    border: 3px solid #2b2250;
    box-shadow: 6px 6px 0 #2b2250;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .titlebar {
    height: 34px;
    background: #edeaff;
    border-bottom: 3px solid #2b2250;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    font-family: 'Pixelify Sans', monospace;
    font-size: 16px;
    font-weight: 700;
    color: #2b2250;
  }
  .titlebar .dots {
    display: flex;
    gap: 6px;
    margin-right: 6px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid #2b2250;
  }
  .dot.r { background: #ff7aa8; }
  .dot.y { background: #ffe27a; }
  .dot.g { background: #7ae582; }
  .titlebar .tab {
    background: #fff;
    border: 2px solid #2b2250;
    border-bottom: 0;
    padding: 3px 10px;
    border-radius: 4px 4px 0 0;
    font-size: 13px;
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #2b2250;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 18px;
  }
  .scene-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    object-fit: fill;
    z-index: 1;
  }
  .pet-wrap {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pet-canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    transform-origin: 50% 100%;
    width: 220px;
    height: 220px;
  }
  .speech-bubble {
    position: absolute;
    bottom: 100%;
    margin-bottom: 8px;
    background: #fff;
    border: 3px solid #2b2250;
    border-radius: 4px;
    padding: 8px 14px;
    font-family: 'Pixelify Sans', monospace;
    font-size: 17px;
    font-weight: 700;
    color: #2b2250;
    opacity: 0;
    transform: scale(0.8) translateY(10px);
    pointer-events: none;
    z-index: 9;
    white-space: nowrap;
    box-shadow: 3px 3px 0 rgba(43, 34, 80, 0.2);
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    left: calc(50% - 6px);
    bottom: -8px;
    width: 10px;
    height: 10px;
    background: #fff;
    border: solid #2b2250;
    border-width: 0 3px 3px 0;
    transform: rotate(45deg);
  }
  .cursor {
    position: absolute;
    width: 22px;
    height: 22px;
    z-index: 99;
    pointer-events: none;
    transition: transform 0.05s linear;
  }
  .cursor svg {
    filter: drop-shadow(2px 2px 0 #2b2250);
  }
  .hud-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.95);
    border: 2px solid #2b2250;
    border-radius: 4px;
    padding: 4px 10px;
    font-family: 'Pixelify Sans', monospace;
    font-size: 14px;
    font-weight: 700;
    color: #2b2250;
    box-shadow: 2px 2px 0 #2b2250;
  }
  .hud-tags {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    gap: 6px;
  }
  .tag {
    background: #ffe27a;
    border: 2px solid #2b2250;
    border-radius: 3px;
    padding: 3px 8px;
    font-family: 'Pixelify Sans', monospace;
    font-size: 12px;
    font-weight: 700;
    color: #2b2250;
    box-shadow: 2px 2px 0 #2b2250;
  }
  .sp {
    position: absolute;
    pointer-events: none;
    z-index: 40;
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="dots">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>
    <div class="tab"><span>🐾</span> Pixel Pals v2.0</div>
  </div>
  <div class="viewport" id="viewport">
    <div class="hud-badge" id="hud-name">Mochi • Tabby Cat</div>
    <div class="hud-tags">
      <span class="tag" id="hud-tag">Cozy Sunlit Room</span>
    </div>
    <canvas class="scene-canvas" id="scene-bg" width="80" height="72"></canvas>
    <div class="pet-wrap" id="pet-wrap">
      <div class="speech-bubble" id="bubble">Purr purr purr...</div>
      <canvas class="pet-canvas" id="pet-cv" width="64" height="64"></canvas>
    </div>
    <div class="cursor" id="cursor" style="left: 450px; top: 120px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 2L20 12L12.5 13.5L8.5 21L4 2Z" fill="#ffffff" stroke="#2b2250" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../src/shared/pixel.js"></script>
<script src="../src/shared/pets.js"></script>
<script src="../src/shared/scenes.js"></script>
<script>
  const petCv = document.getElementById('pet-cv');
  const petCtx = petCv.getContext('2d');
  const petBuf = new Pixel.PixelBuffer(64, 64);

  const sceneCv = document.getElementById('scene-bg');
  const sceneCtx = sceneCv.getContext('2d');
  const sceneBuf = new Pixel.PixelBuffer(80, 72);

  const cursor = document.getElementById('cursor');
  const bubble = document.getElementById('bubble');
  const petWrap = document.getElementById('pet-wrap');
  const hudName = document.getElementById('hud-name');
  const hudTag = document.getElementById('hud-tag');

  let currentPet = 'mochi';
  const petState = {
    t: 0, ox: 0, oy: 0, sx: 1, sy: 1,
    lookX: 0, lookY: 0,
    eyes: 'open', mouth: 'smile',
    blink: 0, blush: 0.3,
    step: 0, walking: 0, sleepy: 0,
    held: 0, swing: 0, flap: 0, ear: 0, gill: 0,
    tail: 0, back: false
  };

  let cursorX = 450, cursorY = 120;
  function updateCursor(x, y) {
    cursorX = x; cursorY = y;
    cursor.style.left = x + 'px';
    cursor.style.top = y + 'px';
  }

  function say(text) {
    bubble.textContent = text;
    gsap.killTweensOf(bubble);
    gsap.fromTo(bubble, { opacity: 0, y: 10, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: 'back.out(2)' });
  }

  function hideSay() {
    gsap.to(bubble, { opacity: 0, duration: 0.2 });
  }

  function burstHearts(col = '#ff7aa8', count = 7) {
    const rect = petWrap.getBoundingClientRect();
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'sp';
      h.innerHTML = `<svg width="18" height="18" viewBox="0 0 10 10"><path fill="${col}" stroke="#2b2250" stroke-width="1" d="M2 1h2v1h2V1h2v3H7v1H6v1H5v1H4V6H3V5H2V4H1V1h1z"/></svg>`;
      h.style.left = (rect.left + rect.width / 2 - 9 + (Math.random() - 0.5) * 50) + 'px';
      h.style.top = (rect.top + rect.height * 0.4 + (Math.random() - 0.5) * 30) + 'px';
      document.body.appendChild(h);
      gsap.to(h, {
        x: (Math.random() - 0.5) * 90,
        y: -60 - Math.random() * 50,
        opacity: 0,
        duration: 0.9,
        ease: 'power1.out',
        onComplete: () => h.remove()
      });
    }
  }

  function burstStars(col = '#ffe27a', count = 6) {
    const rect = petWrap.getBoundingClientRect();
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'sp';
      h.innerHTML = `<svg width="16" height="16" viewBox="0 0 8 8"><path fill="${col}" stroke="#2b2250" stroke-width="0.8" d="M3 0h2v2h2v2H5v2H3V4H1V2h2V0z"/></svg>`;
      h.style.left = (rect.left + rect.width / 2 - 8 + (Math.random() - 0.5) * 50) + 'px';
      h.style.top = (rect.top + rect.height * 0.3) + 'px';
      document.body.appendChild(h);
      gsap.to(h, {
        x: (Math.random() - 0.5) * 80,
        y: -40 - Math.random() * 50,
        rotation: 180,
        opacity: 0,
        duration: 0.8,
        ease: 'power1.out',
        onComplete: () => h.remove()
      });
    }
  }

  function renderFrame(now) {
    const t = now / 1000;
    petState.t = t;

    // Organic breathing & tail/ear
    const breath = Math.sin(t * 2.4) * 0.02;
    petState.sy = 1 + breath;
    petState.sx = 1 - breath * 0.5;
    petState.tail = t * 2.8;

    if (currentPet === 'mochi') {
      petState.ear = Math.sin(t * 3.5) * 0.4;
    } else if (currentPet === 'waddle') {
      petState.flap = Math.max(0, Math.sin(t * 3.2)) * 0.5;
    } else if (currentPet === 'axo') {
      petState.gill = Math.sin(t * 2.4);
    }

    // Look at cursor
    const rect = petWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.5;
    const targetLx = Math.tanh((cursorX - cx) / 120);
    const targetLy = Math.tanh((cursorY - cy) / 120);
    petState.lookX += (targetLx - petState.lookX) * 0.25;
    petState.lookY += (targetLy - petState.lookY) * 0.25;

    // Render pet
    Pets.render(petBuf, currentPet, petState);
    petCtx.putImageData(new ImageData(petBuf.data, 64, 64), 0, 0);

    // Render scene background
    Scenes.draw(sceneBuf, currentPet, t);
    sceneCtx.putImageData(new ImageData(sceneBuf.data, 80, 72), 0, 0);

    requestAnimationFrame(renderFrame);
  }
  requestAnimationFrame(renderFrame);

  // Setup deterministic timeline for recording
  window.runScenario = function(onDone) {
    const tl = gsap.timeline({ onComplete: onDone });

    // Scene 1: Mochi Intro & Cursor Tracking
    tl.call(() => {
      currentPet = 'mochi';
      hudName.textContent = 'Mochi • Tabby Cat';
      hudTag.textContent = 'Cozy Sunlit Room';
      hideSay();
    });
    tl.to(cursor, { left: 160, top: 180, duration: 0.8, onUpdate: () => { cursorX = parseFloat(cursor.style.left); cursorY = parseFloat(cursor.style.top); } });
    tl.to(cursor, { left: 320, top: 220, duration: 0.6, onUpdate: () => { cursorX = parseFloat(cursor.style.left); cursorY = parseFloat(cursor.style.top); } });
    
    // Click Mochi
    tl.call(() => {
      petState.eyes = 'love'; petState.mouth = 'tongue'; petState.blush = 1;
      burstHearts('#ff7aa8', 8);
      say('Purr purr purr...');
      gsap.to(petCv, { scaleY: 0.8, y: -20, duration: 0.15, yoyo: true, repeat: 1 });
    });
    tl.to({}, { duration: 1.0 });

    // Double-click trick (backflip spin)
    tl.call(() => {
      petState.eyes = 'happy'; petState.mouth = 'open';
      say('Ta-da!');
      burstStars('#ffe27a', 6);
      gsap.fromTo(petCv, { rotation: 0 }, {
        rotation: 360, duration: 0.65, ease: 'steps(8)',
        onUpdate() { const p = this.progress(); petState.back = p > 0.28 && p < 0.75; },
        onComplete() { petState.back = false; petState.eyes = 'open'; petState.mouth = 'smile'; }
      });
    });
    tl.to({}, { duration: 0.9 });

    // Scene 2: Switch to Waddle
    tl.call(() => {
      currentPet = 'waddle';
      hudName.textContent = 'Waddle • Penguin';
      hudTag.textContent = 'Mountain Tundra';
      petState.eyes = 'happy'; petState.mouth = 'open';
      say("Look! I found you a pebble!");
      burstHearts('#7f8cff', 6);
      gsap.fromTo(petCv, { y: -30 }, { y: 0, duration: 0.4, ease: 'bounce.out' });
    });
    tl.to(cursor, { left: 460, top: 200, duration: 0.7, onUpdate: () => { cursorX = parseFloat(cursor.style.left); cursorY = parseFloat(cursor.style.top); } });
    tl.to({}, { duration: 0.9 });

    // Scene 3: Switch to Axo
    tl.call(() => {
      currentPet = 'axo';
      hudName.textContent = 'Axo • Axolotl';
      hudTag.textContent = 'Oceanic Lagoon';
      petState.eyes = 'love'; petState.mouth = 'open';
      say("Drink some water! Stay hydrated!");
      burstHearts('#ff7aa8', 7);
      gsap.fromTo(petCv, { y: -25 }, { y: 0, duration: 0.35, ease: 'bounce.out' });
    });
    tl.to(cursor, { left: 240, top: 140, duration: 0.7, onUpdate: () => { cursorX = parseFloat(cursor.style.left); cursorY = parseFloat(cursor.style.top); } });
    tl.to({}, { duration: 0.9 });

    // Scene 4: Drag and Drop Mochi
    tl.call(() => {
      currentPet = 'mochi';
      hudName.textContent = 'Mochi • Tabby Cat';
      hudTag.textContent = 'Fling & Squish Physics';
      hideSay();
    });
    tl.to(cursor, { left: 320, top: 260, duration: 0.4, onUpdate: () => { cursorX = parseFloat(cursor.style.left); cursorY = parseFloat(cursor.style.top); } });
    tl.call(() => {
      petState.held = 1; petState.eyes = 'wide'; petState.mouth = 'o';
      say('Whoa!');
    });
    tl.to(petWrap, { y: -80, x: 40, duration: 0.5, ease: 'power2.out' }, '-=0.1');
    tl.to(cursor, { left: 360, top: 180, duration: 0.5 }, '-=0.5');
    tl.call(() => {
      petState.swing = 0.8;
    });
    tl.to({}, { duration: 0.3 });
    // Drop down and squish
    tl.call(() => {
      petState.held = 0; petState.swing = 0;
      petState.eyes = 'happy'; petState.mouth = 'open';
      say('Hehe!');
    });
    tl.to(petWrap, { y: 0, x: 0, duration: 0.4, ease: 'bounce.out' });
    tl.fromTo(petCv, { scaleY: 0.75, scaleX: 1.25 }, { scaleY: 1, scaleX: 1, duration: 0.5, ease: 'elastic.out(1, 0.4)' }, '-=0.1');
    tl.to({}, { duration: 0.6 });

    return tl;
  };
</script>
</body>
</html>
