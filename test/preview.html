<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
<style>
  body { margin: 0; background: #2b2b3a; font-family: monospace; color: #fff; padding: 20px; }
  h2 { font-size: 14px; margin: 18px 0 4px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .cell { text-align: center; }
  .cell .lbl { font-size: 11px; color: #aab; margin-top: 4px; }
  canvas { image-rendering: pixelated; background:
    repeating-conic-gradient(#3a3a4d 0% 25%, #33334a 0% 50%) 0 0/16px 16px; border-radius: 6px; }
</style>
</head>
<body>
<h1>Pixel Pals — sprite sheet preview</h1>
<div id="root"></div>
<script src="../src/sprites.js"></script>
<script>
  const root = document.getElementById('root');
  const pets = ['mochi', 'biscuit', 'pudding', 'luna', 'clover', 'miso'];
  const combos = [
    ['open + idle',    { face: 'open', mouth: 'idle', tail: 0 }],
    ['blink',          { face: 'blink', mouth: null, tail: 0 }],
    ['happy',          { face: 'happy', mouth: 'open', tail: 1 }],
    ['wide (drag)',    { face: 'wide', mouth: 'open', tail: 0 }],
    ['sleep',          { face: 'blink', mouth: null, tail: 0 }],
    ['smile',          { face: 'open', mouth: 'smile', tail: 1 }],
  ];
  pets.forEach(id => {
    const pet = PIXEL_PALS.build(id);
    const h2 = document.createElement('h2');
    h2.textContent = pet.meta.name + ' — ' + pet.meta.species;
    root.appendChild(h2);
    const r = document.createElement('div'); r.className = 'row';
    combos.forEach(([label, opts]) => {
      const cell = document.createElement('div'); cell.className = 'cell';
      const c = pet.renderToCanvas(5, opts);
      c.style.width = '160px'; c.style.height = '160px';
      const l = document.createElement('div'); l.className = 'lbl'; l.textContent = label;
      cell.appendChild(c); cell.appendChild(l); r.appendChild(cell);
    });
    root.appendChild(r);
  });
  // extra row: slime sprout frames + tail frames detail
  const h3 = document.createElement('h2');
  h3.textContent = 'Details (slime sprouts)';
  root.appendChild(h3);
  const r2 = document.createElement('div'); r2.className = 'row';
  [0, 1].forEach(f => {
    const cell = document.createElement('div'); cell.className = 'cell';
    const c = PIXEL_PALS.build('pudding').renderToCanvas(5, { face: 'open', mouth: 'idle', sprout: f });
    c.style.width = '160px'; c.style.height = '160px';
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = 'sprout ' + f;
    cell.appendChild(c); cell.appendChild(l); r2.appendChild(cell);
  });
  root.appendChild(r2);
</script>
</body>
</html>
