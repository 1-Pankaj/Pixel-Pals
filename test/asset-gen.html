<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
</head>
<body>
<script src="../src/sprites.js"></script>
<script>
  // Renders app icon + per-pet tray icons, exposes them as PNG data URLs.
  window.GEN_ASSETS = function () {
    function upscale(src, factor) {
      const c = document.createElement('canvas');
      c.width = src.width * factor;
      c.height = src.height * factor;
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = false;
      g.drawImage(src, 0, 0, c.width, c.height);
      return c;
    }

    const out = {};

    // --- app icon: rounded pastel card + mochi face ---
    const icon = document.createElement('canvas');
    icon.width = 32; icon.height = 32;
    const ig = icon.getContext('2d');
    // rounded background
    ig.fillStyle = '#ffd76e';
    ig.beginPath();
    ig.roundRect(0, 0, 32, 32, 7);
    ig.fill();
    ig.strokeStyle = '#3a2b20';
    ig.lineWidth = 1.6;
    ig.beginPath();
    ig.roundRect(0.8, 0.8, 30.4, 30.4, 6.4);
    ig.stroke();
    // mochi sprite (head area) centered
    const mochi = PIXEL_PALS.build('mochi').renderToCanvas(1, { face: 'open', mouth: 'idle', tail: 0 });
    ig.imageSmoothingEnabled = false;
    ig.drawImage(mochi, 0, 0, 32, 22, 3, 5, 32, 22);
    out.icon = upscale(icon, 8).toDataURL('image/png');   // 256px

    // --- tray icons: pet face per pet ---
    ['mochi', 'biscuit', 'pudding', 'luna', 'clover', 'miso'].forEach((id) => {
      const t = document.createElement('canvas');
      t.width = 32; t.height = 32;
      const tg = t.getContext('2d');
      tg.imageSmoothingEnabled = false;
      const s = PIXEL_PALS.build(id).renderToCanvas(1, { face: 'open', mouth: 'idle', tail: 0 });
      tg.drawImage(s, 0, 0, 32, 26, 0, 3, 32, 26);
      out['tray_' + id] = t.toDataURL('image/png');       // 32px
    });

    return out;
  };
</script>
</body>
</html>
