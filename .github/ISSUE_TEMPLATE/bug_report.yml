name: Bug Report
description: Report a bug, crash, or visual glitch in Pixel Pals
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible so we can reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
      placeholder: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug.
      placeholder: |
        1. Adopted Mochi
        2. Dragged the pet to the top-right corner
        3. Pressed Alt+Shift+D
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 10
        - Windows 11
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pixel Pals Version
      description: Found in package.json or app release (e.g. 2.0.0)
      placeholder: "2.0.0"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console or Error Logs
      description: If running from source, paste any terminal or DevTools errors.
      render: shell
    validations:
      required: false
